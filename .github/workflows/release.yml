name: release

# Pushing a tag such as v0.2.0 builds the binaries, installs and tests each one on its own
# platform, and only then publishes them as a GitHub release, where install.sh downloads them.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    # macOS, so the Mac binaries are built where their code signature can be checked.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in package.json."
            exit 1
          fi
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm compile --all
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release/
          if-no-files-found: error

  smoke-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # One runner per entry in RELEASE_TARGETS (config/release.ts).
        runner: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      - name: Install with install.sh
        run: PANE_DOWNLOAD_BASE="file://$PWD/release" PANE_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
      - name: Smoke test
        run: scripts/smoke-test.sh "$RUNNER_TEMP/bin/pane"

  publish:
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" release/*
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
